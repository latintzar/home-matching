name: Native home workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node --experimental-strip-types tools/first-match.mjs
      - run: node --experimental-strip-types --test tests/first-match.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci --prefix starter
      - run: npm audit --prefix starter
      - run: npm audit
      - run: node tools/source-reference.mjs
      - run: python3 tools/link-gate.py
      - run: npm run build --prefix starter
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: python3 -m pip install playwright==1.62.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Native UI and network boundary
        run: |
          npm run start --prefix starter -- --port 4188 > /tmp/home-matching-ui.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4188',timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Preview did not start')
          PY
          python3 starter/capture-interface.py --output /tmp/home-matching-browser-proof

  native-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --experimental-strip-types --test tests/first-match.test.mjs tests/native-sample.test.mjs tests/native-fit.test.mjs tests/lazy-resource.test.mjs tests/sample-request.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/sample-app.py build --base-path /apps/home-matching
      - run: python3 -m pip install playwright==1.62.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Native saved state, profile fit and guest boundary
        run: |
          python3 tools/sample-app.py start --base-path /apps/home-matching --port 4189 --state-dir /tmp/home-native-ci-state > /tmp/home-native-ci.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4189/apps/home-matching/dashboard',timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Native workspace did not start')
          PY
          python3 tests/browser_native.py
